name: Build and deploy Sol.College
on:
  push: {branches: [main]}
  schedule: [{cron: "17 * * * *"}]   # hourly: picks up new forks and catalog.json changes
  workflow_dispatch:
  repository_dispatch: {types: [catalog-updated]}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: work, key: "work-${{ github.run_id }}", restore-keys: "work-"}
      - name: Fetch catalog and clone projects
        env: {GH_TOKEN: "${{ secrets.CATALOG_TOKEN || github.token }}"}
        run: python3 scripts/fetch_data.py
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build lesson dapp bundle
        run: cd dapps/app && npm ci --no-audit --no-fund && npm run build
      - name: Build site
        env: {SITE_CNAME: "${{ vars.SITE_CNAME }}", SITE_BASE: "${{ vars.SITE_BASE }}"}
        run: cd scripts && cd .. && PYTHONPATH=scripts python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
