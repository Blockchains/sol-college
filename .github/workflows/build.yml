name: Build and deploy Sol.College
on:
  push: {branches: [main]}
  schedule: [{cron: "17 * * * *"}]   # hourly: picks up new forks and catalog.json changes
  workflow_dispatch:
    inputs:
      full: {description: "Full rebuild of every page (slow, ~30 min)", type: boolean, default: false}
  repository_dispatch: {types: [catalog-updated]}
permissions: {contents: read, pages: write, id-token: write, actions: read}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: {GH_TOKEN: "${{ secrets.CATALOG_TOKEN || github.token }}", SITE_CNAME: "${{ vars.SITE_CNAME }}", SITE_BASE: "${{ vars.SITE_BASE }}", PUBLISH_BATCH: "15", PUBLISH_MAX: "15", PUBLISH_PAUSED: "${{ vars.PUBLISH_PAUSED || '1' }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Incremental (default): start from the last deployed Pages artifact and render only the next unpublished lessons.
      - name: Download previously deployed site
        id: prev
        if: ${{ !inputs.full }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=30" -q '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty' || true)
          if [ -n "$id" ] && gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > prev.zip && unzip -q prev.zip -d prev && mkdir site && tar -xf prev/artifact.tar -C site && [ -f site/published.json ]; then
            echo "incremental=1" >> "$GITHUB_OUTPUT"; echo "using artifact $id: $(du -sh site | cut -f1)"
          else rm -rf site; echo "no previous artifact: full build"; fi
      - name: Free runner disk (full build only)
        if: ${{ steps.prev.outputs.incremental != '1' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      # PUBLISH_PAUSED=1 (default since 2026-11-10): no new source-only lessons are published; incremental runs keep the
      # deployed pages and only re-apply lesson status + live devnet apps (scripts/live_devnet.py). Set repo var PUBLISH_PAUSED=0 to resume.
      - name: Fetch catalog and clone projects
        if: ${{ !(steps.prev.outputs.incremental == '1' && env.PUBLISH_PAUSED == '1') }}
        run: |
          if [ "${{ steps.prev.outputs.incremental }}" = "1" ]; then INCREMENTAL_PREV=site CLONE_N=60 python3 scripts/fetch_data.py; else python3 scripts/fetch_data.py; fi
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build lesson dapp bundle
        run: cd dapps/app && npm ci --no-audit --no-fund && npm run build
      - name: Build site
        if: ${{ !(steps.prev.outputs.incremental == '1' && env.PUBLISH_PAUSED == '1') }}
        run: |
          if [ "${{ steps.prev.outputs.incremental }}" = "1" ]; then
            INCREMENTAL=1 SITE_OUT=site_new PUBLISHED_FROM="file://$PWD/site" PYTHONPATH=scripts python3 scripts/build.py && python3 scripts/merge_incremental.py
          else PYTHONPATH=scripts python3 scripts/build.py; fi
      - name: Lesson status, live devnet apps and homepage section
        run: python3 scripts/live_devnet.py site
      - name: Core lessons (one step-by-step lesson per live devnet app; homepage, nav, source library labels)
        run: python3 scripts/core_lessons.py site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
