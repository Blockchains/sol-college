name: minds-admin
# Operator console for one explicitly named project. Read-only actions run in environment 'minds';
# state-changing actions run in environment 'minds-admin', which requires a reviewer to approve the run.
# Targets are project slugs resolved through the protected mapping; a raw Mind ID is never accepted.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options: [inventory, project, reconcile, telemetry, capabilities, equip, circle, pause, resume, provision]
      project: { description: "Project slug (not a Mind ID)", required: false, type: string }
      args: { description: "Extra args for mutations, e.g. --skills id1,id2 | --add a@b.c | --name N --archetype A", required: false, type: string }
permissions: { contents: read }
concurrency: { group: "minds-admin-${{ inputs.project || 'account' }}", cancel-in-progress: false }
jobs:
  read:
    if: ${{ contains(fromJSON('["inventory","project","reconcile","telemetry","capabilities"]'), inputs.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: minds
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund
      - env:
          MINDS_BUILDER_API_KEY: ${{ secrets.MINDS_BUILDER_API_KEY }}
          MINDS_PROJECT_MAP: ${{ secrets.MINDS_PROJECT_MAP }}
          ACTION: ${{ inputs.action }}
          PROJECT: ${{ inputs.project }}
        run: cd pilot && npx tsx src/minds/cli.ts "$ACTION" ${PROJECT:+"$PROJECT"}
  mutate:
    if: ${{ contains(fromJSON('["equip","circle","pause","resume","provision"]'), inputs.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minds-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund
      - name: Private records location (fails closed until a private control repo is configured)
        env: { CONTROL_REPO: "${{ vars.SC_CONTROL_REPO }}" }
        run: |
          if [ -z "$CONTROL_REPO" ]; then echo "MANUAL SETUP REQUIRED: set repo variable SC_CONTROL_REPO (private repo) and secret SC_CONTROL_DEPLOY_KEY"; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: "${{ vars.SC_CONTROL_REPO }}", ssh-key: "${{ secrets.SC_CONTROL_DEPLOY_KEY }}", path: control }
      - name: Move private records out of the public workspace
        run: mv control "$RUNNER_TEMP/control"
      - env:
          MINDS_BUILDER_API_KEY: ${{ secrets.MINDS_BUILDER_API_KEY }}
          MINDS_PROJECT_MAP: ${{ secrets.MINDS_PROJECT_MAP }}
          SC_CIRCLE_APPROVED_MEMBERS: ${{ secrets.SC_CIRCLE_APPROVED_MEMBERS }}
          SC_PRIVATE_RECORDS_DIR: ${{ runner.temp }}/control/records
          ACTION: ${{ inputs.action }}
          PROJECT: ${{ inputs.project }}
          ARGS: ${{ inputs.args }}
          APPROVAL_REF: "environment-approval:run-${{ github.run_id }}"
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          read -r -a EXTRA <<< "${ARGS:-}"
          cd pilot && npx tsx src/minds/cli.ts "$ACTION" "$PROJECT" "${EXTRA[@]}" --approve "$APPROVAL_REF" --approved-by "$ACTOR"
      - name: Persist private state
        run: |
          cd "$RUNNER_TEMP/control" && git config user.name "sol-college-pilot" && git config user.email "actions@users.noreply.github.com"
          git add -A records && (git diff --cached --quiet || (git commit -qm "minds-admin ${{ inputs.action }} ${{ inputs.project }} run ${{ github.run_id }}" && git push -q))
