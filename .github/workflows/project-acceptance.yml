name: project-acceptance
# Two paths to an adoption acceptance; both re-verify against GitHub and record nothing on failure.
# 1) AUTO (owner policy t690u, 2026-11-15): dispatched with a package id (by adoption-package or cto-autonomy).
#    Accepted with no human comment only when ALL hold: candidate-validation passed on the exact candidate commit,
#    the adoption package exists, its sha256 matches the recomputed canonical hash, and the candidate matches.
#    Recorded as "auto-accepted by owner policy (2026-11-15, user instruction)" (public record, private log, certificate):
#    no human reviewed it.
# 2) MANUAL (optional): a NEW issue comment starting with /sc-accept by a configured reviewer (login + account id +
#    role + association), exact package/hash/candidate, current upstream head and validation verdict.
# Then the contribution certificate is issued (certificate-publication) and the campus republished.
on:
  issue_comment: { types: [created] }
  workflow_dispatch:
    inputs:
      package_id: { description: "Adoption package id (auto-acceptance by owner policy)", required: true, type: string }
permissions: { contents: write, issues: write, actions: write }
concurrency: { group: records-main, cancel-in-progress: false }
jobs:
  accept-auto:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    outputs:
      package: ${{ steps.acc.outputs.package }}
      subjects: ${{ steps.acc.outputs.subjects }}
    steps:
      - name: Request checks
        env: { REF: "${{ github.ref }}", PKG: "${{ inputs.package_id }}" }
        run: test "$REF" = "refs/heads/main" && [[ "$PKG" =~ ^[a-z0-9-]+-[0-9a-f]{12}-v[0-9]+$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: "${{ vars.SC_CONTROL_REPO }}", ssh-key: "${{ secrets.SC_CONTROL_DEPLOY_KEY }}", path: control }
      - name: Move private records out of the public workspace
        run: mv control "$RUNNER_TEMP/control"
      - id: acc
        env: { GITHUB_TOKEN: "${{ github.token }}", PKG: "${{ inputs.package_id }}", SC_PRIVATE_RECORDS_DIR: "${{ runner.temp }}/control/records" }
        run: |
          set -euo pipefail
          cd pilot && npx tsx src/acceptance/cli.ts auto "$PKG" | tee "$RUNNER_TEMP/acc.json"
          echo "package=$(jq -r '.packageId // empty' "$RUNNER_TEMP/acc.json")" >> "$GITHUB_OUTPUT"
          echo "subjects=$(jq -c '.subjectCandidates // []' "$RUNNER_TEMP/acc.json")" >> "$GITHUB_OUTPUT"
      - name: Persist (private log, then public record)
        run: |
          cd "$RUNNER_TEMP/control" && git config user.name "sol-college-acceptance" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A records && (git diff --cached --quiet || (git commit -qm "auto-acceptance ${{ steps.acc.outputs.package }} run ${{ github.run_id }}" && git push -q))
          cd "$GITHUB_WORKSPACE" && git config user.name "sol-college-acceptance" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/public/acceptance && (git diff --cached --quiet || (git commit -qm "project-acceptance (auto, owner policy) ${{ steps.acc.outputs.package }}" && for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done))
  accept:
    if: ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/sc-accept ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.acc.outputs.package }}
      subjects: ${{ steps.acc.outputs.subjects }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund
      - id: acc
        env: { GITHUB_TOKEN: "${{ github.token }}", COMMENT_ID: "${{ github.event.comment.id }}" }
        run: |
          set -euo pipefail
          cd pilot && npx tsx src/acceptance/cli.ts "$GITHUB_REPOSITORY" "$COMMENT_ID" | tee "$RUNNER_TEMP/acc.json"
          echo "package=$(jq -r '.packageId // empty' "$RUNNER_TEMP/acc.json")" >> "$GITHUB_OUTPUT"
          echo "subjects=$(jq -c '.subjectCandidates // []' "$RUNNER_TEMP/acc.json")" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "sol-college-pilot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/public/acceptance && (git diff --cached --quiet || (git commit -qm "project-acceptance ${{ steps.acc.outputs.package }}" && git pull -q --rebase && git push -q))
      - name: Report outcome on the issue
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", ISSUE: "${{ github.event.issue.number }}", OUTCOME: "${{ steps.acc.outcome }}" }
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Acceptance check ($OUTCOME): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  certificate:
    needs: [accept-auto, accept]
    if: ${{ always() && (needs.accept-auto.outputs.package != '' || needs.accept.outputs.package != '') }}
    strategy: { matrix: { subject: "${{ fromJSON(needs.accept-auto.outputs.subjects || needs.accept.outputs.subjects || '[]') }}" }, max-parallel: 1 }
    uses: ./.github/workflows/certificate-publication.yml
    with: { package_id: "${{ needs.accept-auto.outputs.package || needs.accept.outputs.package }}", subject: "${{ matrix.subject }}" }
    permissions: { contents: write, actions: write }
