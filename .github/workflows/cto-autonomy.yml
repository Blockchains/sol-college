name: cto-autonomy
# Autonomous CTO loop for every project listed in config/autonomy.json (standing approval recorded there).
# Runs every 2 hours in the protected environment 'minds' (main branch only, no manual reviewer):
#   reconcile pending Mind tasks -> act on validated results (research-question issues, adoption packages,
#   Lab Reporter status) -> upstream tracking -> new lab PR heads: candidate-validation + PR triage ->
#   passing candidates: adoption draft -> periodic research plan and status report.
# Never: Mind lifecycle, Circles, pause/resume, acceptance, mainnet, upstream comments. No contributor code runs here.
on:
  schedule: [{ cron: "17 */2 * * *" }]
  workflow_dispatch:
    inputs:
      dry_run: { type: boolean, default: false }
permissions: { contents: write, issues: write, actions: write }
concurrency: { group: cto-autonomy, cancel-in-progress: false }
jobs:
  autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minds
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund
      - name: Private control repository (required; fails closed)
        env: { CONTROL_REPO: "${{ vars.SC_CONTROL_REPO }}" }
        run: |
          test -n "$CONTROL_REPO" || { echo "MANUAL SETUP REQUIRED - vars.SC_CONTROL_REPO"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: "${{ vars.SC_CONTROL_REPO }}", ssh-key: "${{ secrets.SC_CONTROL_DEPLOY_KEY }}", path: control }
      - name: Move private records out of the public workspace
        run: mv control "$RUNNER_TEMP/control"
      - name: Autonomy pass
        id: run
        env:
          MINDS_BUILDER_API_KEY: ${{ secrets.MINDS_BUILDER_API_KEY }}
          MINDS_PROJECT_MAP: ${{ secrets.MINDS_PROJECT_MAP }}
          GITHUB_TOKEN: ${{ github.token }}
          SC_PRIVATE_RECORDS_DIR: ${{ runner.temp }}/control/records
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          cd pilot && npx tsx src/autonomy/cli.ts $DRY | tee "$RUNNER_TEMP/autonomy.json"
      - name: Persist private records (control repo)
        if: always()
        run: |
          cd "$RUNNER_TEMP/control" && git config user.name "sol-college-cto-autonomy" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A records && (git diff --cached --quiet || (git commit -qm "autonomy run ${{ github.run_id }}" && git push -q))
      - name: Publish public records (status, upstream, adoption)
        if: always()
        run: |
          git config user.name "sol-college-cto-autonomy" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/public && (git diff --cached --quiet || (git commit -qm "cto-autonomy: public status ${{ github.run_id }}" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done))
      - name: Refresh campus
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main || true
      - name: Summary
        if: always()
        run: |
          { echo "## CTO autonomy"; echo '```json'; cat "$RUNNER_TEMP/autonomy.json" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
