name: campus-publication
# Builds the allowlisted public campus projection (no secrets in this workflow), checks it, then asks the
# existing Pages deployment (build.yml) to publish. The projection fails closed on private fields or
# secret-shaped content.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["records/public/**", "config/projects/**", "campus/**"]
permissions: { contents: read, actions: write }
concurrency: { group: campus-publication, cancel-in-progress: true }
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: pilot/package-lock.json }
      - run: cd pilot && npm ci --no-audit --no-fund && npm run campus:build -- ../site-pilot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: campus-projection, path: site-pilot/campus/data.json, retention-days: 30 }
      - name: Deploy through the existing Pages workflow
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
